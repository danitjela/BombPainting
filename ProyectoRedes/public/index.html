<!DOCTYPE html>
<html lang="en">
<head>
  <!-- DOCTYPE Y LENGUAJE DEL DOCUMENTO -->
  <meta charset="UTF-8"> <!-- SOPORTE DE TILDES -->

  <title>BombPainting</title> <!-- TÍTULO DE LA PÁGINA -->

  <style>

<body>
  <!-- CONTENEDOR DONDE SE MONTA EL JUEGO (PHASER) -->
